<div class="container">
  <div class="card">

    <!-- HEADER -->
    <h2>{{ editId ? 'Edit Patient' : 'Add Patient' }}</h2>

    <!-- PROGRESS BAR -->
    <div class="progress-container">
      <div class="progress-bar-wrapper">
        <div class="progress-bar" [style.width.%]="progress"></div>
      </div>

      <!-- STEP DOTS -->
      <div class="steps">
        <div class="step"
             *ngFor="let s of [0,1,2,3,4,5,6]; let i = index"
             [class.active]="step === i"
             [class.completed]="step > i">
          Step {{ i + 1 }}
        </div>
      </div>
    </div>

    <!-- TAB NAVIGATION -->
    <div class="tabs">
      <div class="tab" [class.active]="step === 0" (click)="step = 0">Demographics</div>
      <div class="tab" [class.active]="step === 1" (click)="step = 1">Diagnosis</div>
      <div class="tab" [class.active]="step === 2" (click)="step = 2">Genetic</div>
      <div class="tab" [class.active]="step === 3" (click)="step = 3">Family</div>
      <div class="tab" [class.active]="step === 4" (click)="step = 4">Symptoms</div>
      <div class="tab" [class.active]="step === 5" (click)="step = 5">Functional</div>
      <div class="tab" [class.active]="step === 6" (click)="step = 6">Treatment</div>
    </div>

    <!-- FORM -->
    <form [formGroup]="form">

      <!-- ================= STEP 1 ================= -->
      <div *ngIf="step === 0">

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" formControlName="fullName">
        </div>

        <div class="row">
          <div class="col-6 form-group">
            <label>Date of Birth</label>
            <input type="date" formControlName="dob">
          </div>

          <div class="col-6 form-group">
            <label>Gender</label>
            <select formControlName="gender">
              <option value="">Select</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Permanent Address</label>
          <textarea rows="2" formControlName="permanentAddress"></textarea>
        </div>

        <div class="row">
          <div class="col-6 form-group">
            <label>Ethnicity</label>
            <input type="text" formControlName="ethnicity">
          </div>

          <div class="col-6 form-group">
            <label>Marital Status</label>
            <input type="text" formControlName="maritalStatus">
          </div>
        </div>

        <div class="row">
          <div class="col-6 form-group">
            <label>Height (cm)</label>
            <input type="number" formControlName="height">
          </div>

          <div class="col-6 form-group">
            <label>Weight (kg)</label>
            <input type="number" formControlName="weight">
          </div>
        </div>

      </div>

      <!-- ================= STEP 2 ================= -->
      <div *ngIf="step === 1">

        <div class="form-group">
          <label>Age when symptoms noticed</label>
          <input type="number" formControlName="symptomAge">
        </div>

        <div class="form-group">
          <label>First Symptoms</label>
          <select multiple formControlName="firstSymptoms">
            <option *ngFor="let s of firstSymptomsOptions" [value]="s">
              {{ s }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label>Age at Diagnosis</label>
          <input type="number" formControlName="diagnosisAge">
        </div>

        <div class="form-group">
          <label>Diagnosed By</label>
          <select formControlName="diagnosedBy">
            <option value="">Select</option>
            <option *ngFor="let d of diagnosedByOptions" [value]="d">
              {{ d }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label>Diagnostic Method</label>
          <select formControlName="diagnosticMethod">
            <option value="">Select</option>
            <option *ngFor="let d of diagnosisMethodOptions" [value]="d">
              {{ d }}
            </option>
          </select>
        </div>

      </div>

      <!-- ================= STEP 3 ================= -->
      <div *ngIf="step === 2">

        <div class="form-group">
          <label>Genetic Testing Done?</label>
          <select formControlName="geneticTesting">
            <option value="">Select</option>
            <option *ngFor="let g of yesNoPendingOptions" [value]="g">
              {{ g }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label>Gene Mutation Identified</label>
          <textarea rows="2" formControlName="mutation"></textarea>
        </div>

        <div class="form-group">
          <label>Upload Genetic Report (PDF)</label>
          <input type="file" (change)="onFileChange($event)">
        </div>

      </div>

      <!-- ================= STEP 4 ================= -->
      <div *ngIf="step === 3">

        <div class="form-group">
          <label>Family History of CMT?</label>
          <select formControlName="familyHistory">
            <option value="">Select</option>
            <option *ngFor="let y of yesNoOptions" [value]="y">
              {{ y }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label>Affected Relatives</label>
          <select multiple formControlName="affectedRelatives">
            <option *ngFor="let r of relationshipOptions" [value]="r">
              {{ r }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label>Consanguinity</label>
          <select formControlName="consanguinity">
            <option value="">Select</option>
            <option *ngFor="let c of consanguinityOptions" [value]="c">
              {{ c }}
            </option>
          </select>
        </div>

      </div>

      <!-- ================= STEP 5 ================= -->
      <div *ngIf="step === 4">

        <div class="form-group">
          <label>Lower Limb Symptoms</label>
          <textarea rows="2" formControlName="lowerLimb"></textarea>
        </div>

        <div class="form-group">
          <label>Upper Limb Symptoms</label>
          <textarea rows="2" formControlName="upperLimb"></textarea>
        </div>

        <div class="form-group">
          <label>Sensory Symptoms</label>
          <textarea rows="2" formControlName="sensory"></textarea>
        </div>

      </div>

      <!-- ================= STEP 6 ================= -->
      <div *ngIf="step === 5">

        <div class="form-group">
          <label>Mobility Status</label>
          <select formControlName="mobility">
            <option value="">Select</option>
            <option *ngFor="let m of mobilityOptions" [value]="m">
              {{ m }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label>Walking Distance</label>
          <select formControlName="walkingDistance">
            <option value="">Select</option>
            <option *ngFor="let w of walkingDistanceOptions" [value]="w">
              {{ w }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label>Falls in Last Year</label>
          <textarea rows="2" formControlName="falls"></textarea>
        </div>

      </div>

      <!-- ================= STEP 7 ================= -->
      <div *ngIf="step === 6">

        <div class="form-group">
          <label>Treatment Details</label>
          <select multiple formControlName="treatments">
            <option *ngFor="let t of treatmentOptions" [value]="t">
              {{ t }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label>Clinical Trials Participation</label>
          <textarea rows="2" formControlName="clinicalTrials"></textarea>
        </div>

        <div class="form-group">
          <label>Access to Care Issues</label>
          <textarea rows="2" formControlName="accessToCare"></textarea>
        </div>

      </div>

    </form>

    <!-- BUTTONS -->
    <div class="buttons">
      <button class="btn btn-secondary"
              (click)="prev()"
              [disabled]="step === 0">
        Back
      </button>

      <button class="btn btn-primary"
              (click)="next()"
              *ngIf="step < 6">
        Next
      </button>

      <button class="btn btn-success"
              (click)="submit()"
              *ngIf="step === 6">
        Submit
      </button>
    </div>

  </div>
</div>
